# Full stack: FastAPI (app) + PostgreSQL (db) + Ollama (llm).
# Migrations: one-shot `db-migrate` (Liquibase image) runs before `app` — no Java in the app image.
# Ports: app 8080, Postgres 5432, Ollama 11434 — see docs/deployment-guide.md
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: examinai
      POSTGRES_PASSWORD: examinai
      POSTGRES_DB: examinai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examinai -d examinai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-migrate:
    image: liquibase/liquibase:4.29
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_PASSWORD: examinai
    command:
      # Liquibase 4.x resolves changelog files against --search-path; /changelog alone is not on the default path.
      - "--search-path=/changelog"
      - "--changelog-file=db.changelog-master.xml"
      - "--url=jdbc:postgresql://db:5432/examinai"
      - "--username=examinai"
      - "update"
    volumes:
      - ./db/changelog:/changelog

  llm:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EXAMINAI_USE_LIQUIBASE: "1"
      EXAMINAI_DATABASE_URL: postgresql+psycopg://examinai:examinai@db:5432/examinai
      EXAMINAI_ADMIN_INITIAL_PASSWORD: ${EXAMINAI_ADMIN_INITIAL_PASSWORD:-}
      EXAMINAI_ADMIN_EMAIL: ${EXAMINAI_ADMIN_EMAIL:-admin@examinai.local}
      OLLAMA_BASE_URL: http://llm:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EXAMINAI_SECRET_KEY: ${EXAMINAI_SECRET_KEY:-dev-insecure-change-me}
    ports:
      - "8080:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      llm:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
