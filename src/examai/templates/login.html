<!DOCTYPE html>
<html lang="en">
<head>
  {% include "fragments/head-bootstrap.html" %}
  <title>Sign in — Examinai</title>
</head>
<body class="examai-shell d-flex flex-column min-vh-100">
  <nav class="navbar navbar-light bg-light examai-nav">
    <div class="container">
      <a class="navbar-brand" href="/">Examinai</a>
    </div>
  </nav>
  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <h1 class="h4 mb-4">Sign in</h1>
        {% if flash %}
        <div class="alert alert-warning" role="alert">{{ flash }}</div>
        {% endif %}
        <form action="/login" method="post" class="card card-body shadow-sm">
          {% include "fragments/csrf-field.html" %}
          <div class="mb-3">
            <label class="form-label" for="username">Email</label>
            <input class="form-control" id="username" name="username" type="email" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </main>
  {% include "fragments/welcome-scripts.html" %}
</body>
</html>
