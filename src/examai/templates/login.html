<!DOCTYPE html>
<html lang="en">
<head>
  {% include "fragments/head-bootstrap.html" %}
  <title>Sign in — Examinai</title>
</head>
<body class="examai-shell d-flex flex-column min-vh-100">
  <nav class="navbar navbar-light bg-light examai-nav">
    <div class="container">
      <a class="navbar-brand" href="/">Examinai</a>
    </div>
  </nav>
  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <h1 class="h4 mb-4">Sign in</h1>
        {# POST /login + session handling land in Story 1.3; form is present for UX parity only. #}
        <form action="/login" method="post" class="card card-body shadow-sm">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" disabled aria-disabled="true" title="Sign-in is not implemented yet (Story 1.3)">
            Sign in
          </button>
          <p class="small text-muted mt-3 mb-0">Credential verification is not enabled in this story.</p>
        </form>
      </div>
    </div>
  </main>
  {% include "fragments/welcome-scripts.html" %}
</body>
</html>
